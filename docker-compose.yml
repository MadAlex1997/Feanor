x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: feanor-airflow:local
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-feanor}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/airflow"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:-changeme}"
    AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    FEANOR_API_URL: "http://api:8080"
    FEANOR_CLIENT_ID: "${AIRFLOW_SA_CLIENT_ID:-airflow-sa}"
    FEANOR_CLIENT_SECRET: "${AIRFLOW_SA_CLIENT_SECRET:-changeme-airflow-sa}"
    FEANOR_KEYCLOAK_URL: "http://keycloak:8080"
    FEANOR_REALM: feanor
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  networks:
    - feanor

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feanor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-feanor}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - feanor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - ./volumes/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - feanor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-feanor}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/feanor-realm.json:/opt/keycloak/data/import/feanor-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - feanor
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8080' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  traefik:
    image: traefik:v3
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:8000
      - --log.level=INFO
    ports:
      - "8000:8000"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - feanor
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-feanor}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-feanor}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: feanor
      FEANOR_API_URL: http://api:8080
      FEANOR_DISPATCHER_CLIENT_ID: ${FEANOR_DISPATCHER_CLIENT_ID:-dispatcher}
      FEANOR_DISPATCHER_CLIENT_SECRET: ${FEANOR_DISPATCHER_CLIENT_SECRET:-changeme}
      FEANOR_S3_ENDPOINT: http://minio:9000
      FEANOR_RESULT_PREFIX: feanor-results
      FEANOR_DOCKER_NETWORK: feanor
      TRINO_CATALOG_DIR: /var/trino-catalog
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      LOG_BUCKET: feanor-logs
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/trino/catalog:/var/trino-catalog
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - feanor
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      # Public routes — no JWT required (health checks, docs, auth verify endpoint).
      - "traefik.http.routers.api-public.rule=PathPrefix(`/health`) || PathPrefix(`/ready`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/auth/verify`)"
      - "traefik.http.routers.api-public.entrypoints=web"
      - "traefik.http.routers.api-public.middlewares=rate-limit@file"
      - "traefik.http.routers.api-public.priority=20"
      # Protected routes — JWT required.
      - "traefik.http.routers.api-protected.rule=PathPrefix(`/v1`)"
      - "traefik.http.routers.api-protected.entrypoints=web"
      - "traefik.http.routers.api-protected.middlewares=jwt-auth@file,rate-limit@file"
      - "traefik.http.routers.api-protected.priority=10"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/feanor-results;
        mc mb --ignore-existing local/feanor-logs;
        mc mb --ignore-existing local/feanor-test;
        echo 'MinIO buckets ready.';
      "
    networks:
      - feanor
    restart: on-failure

  trino:
    image: trinodb/trino:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feanor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-feanor}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - ./infra/trino:/etc/trino:ro
      - trino-data:/data/trino
      - trino-hive-catalog:/data/trino-hive-catalog
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - feanor
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:-admin}"
    command: >
      bash -c "
        airflow db migrate &&
        airflow fab create-user
          --username admin
          --password $$AIRFLOW_ADMIN_PASSWORD
          --firstname Feanor --lastname Admin
          --role Admin --email admin@feanor.local
          2>&1 | grep -v 'already exists' || true &&
        python /opt/airflow/setup_connections.py &&
        python /opt/airflow/seed_variables.py
      "
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - ./airflow/setup_connections.py:/opt/airflow/setup_connections.py:ro
      - ./airflow/seed_variables.py:/opt/airflow/seed_variables.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/serverless/Dockerfile
    image: feanor-worker-serverless:local
    profiles:
      - worker
    environment:
      FEANOR_API_URL: http://api:8080
      FEANOR_S3_ENDPOINT: http://minio:9000
      FEANOR_RESULT_BUCKET: feanor-results
    networks:
      - feanor

networks:
  feanor:
    name: feanor

volumes:
  trino-data:
  trino-hive-catalog:
  airflow-logs:
