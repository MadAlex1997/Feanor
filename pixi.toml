[workspace]
name = "feanor"
version = "0.1.0"
description = "Fëanor federated data and compute platform"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.12"

[feature.api.dependencies]
fastapi = ">=0.110,<1"
uvicorn = ">=0.29"
sqlalchemy = ">=2.0,<3"
alembic = ">=1.13"
pydantic = ">=2.0,<3"
httpx = ">=0.27"
asyncpg = ">=0.29"
pyjwt = ">=2.8"
cryptography = ">=41"

[feature.lint.dependencies]
black = ">=24"
ruff = ">=0.4"

[environments]
api = { features = ["api", "lint"], solve-group = "default" }
default = { features = ["lint"], solve-group = "default" }

[tasks]
api-dev = { cmd = "uvicorn api.app.main:app --reload --host 0.0.0.0 --port 8080", env = { PYTHONPATH = "." } }
lint = { cmd = "black --check api && ruff check api" }
lint-fix = { cmd = "black api && ruff check --fix api" }
db-upgrade = { cmd = "alembic upgrade head", env = { PYTHONPATH = "." } }
db-downgrade = { cmd = "alembic downgrade -1", env = { PYTHONPATH = "." } }
