[workspace]
name = "feanor"
version = "0.1.0"
description = "Fëanor federated data and compute platform"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.12"

[feature.api.dependencies]
fastapi = ">=0.110,<1"
uvicorn = ">=0.29"
sqlalchemy = ">=2.0,<3"
alembic = ">=1.13"
pydantic = ">=2.0,<3"
httpx = ">=0.27"
asyncpg = ">=0.29"
pyjwt = ">=2.8"
cryptography = ">=41"
aiofiles = ">=23"

[feature.api.pypi-dependencies]
docker = ">=7"
boto3 = ">=1.34"

[feature.sdk.dependencies]
typer = ">=0.12"
httpx = ">=0.27"
pydantic = ">=2.0,<3"
pyyaml = ">=6"
rich = ">=13"

[feature.sdk.pypi-dependencies]
feanor = { path = "feanor/", editable = true }

[feature.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"
httpx = ">=0.27"
black = ">=24"
ruff = ">=0.4"

[feature.dev.pypi-dependencies]
testcontainers = { version = ">=4.0", extras = ["postgres"] }

[feature.worker.pypi-dependencies]
duckdb = ">=0.10"

[feature.lint.dependencies]
black = ">=24"
ruff = ">=0.4"

[environments]
default = { features = ["api", "sdk", "worker", "dev"], solve-group = "default" }
api = { features = ["api", "lint"], solve-group = "default" }
sdk = { features = ["sdk", "dev"], solve-group = "default" }
worker = { features = ["worker", "sdk", "dev"], solve-group = "default" }
airflow-tests = { features = ["airflow-tests", "sdk", "dev"], solve-group = "airflow-tests" }

[feature.airflow-tests.pypi-dependencies]
apache-airflow = ">=3.2.1,<4"

[tasks]
api-dev = { cmd = "uvicorn api.app.main:app --reload --host 0.0.0.0 --port 8080", env = { PYTHONPATH = "." } }
test = { cmd = "pytest --ignore=volumes -m 'not e2e'", env = { PYTHONPATH = "." } }
test-e2e = { cmd = "pytest -m e2e", env = { PYTHONPATH = "." } }
lint = { cmd = "black --check api feanor && ruff check api feanor" }
lint-fix = { cmd = "black api feanor && ruff check --fix api feanor" }
db-upgrade = { cmd = "alembic upgrade head", env = { PYTHONPATH = "." } }
db-downgrade = { cmd = "alembic downgrade -1", env = { PYTHONPATH = "." } }
build-airflow = { cmd = "docker compose build airflow-webserver" }
