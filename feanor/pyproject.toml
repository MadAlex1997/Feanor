[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feanor"
version = "0.1.0"
description = "Fëanor federated data and compute platform — SDK and CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0,<3",
    "pyyaml>=6",
    "rich>=13",
]

[project.scripts]
feanor = "feanor.cli:app"

[tool.setuptools.packages.find]
where = [".."]
include = ["feanor*"]
